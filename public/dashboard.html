<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mi Panel — BotManager</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;--bg2:#13161e;--bg3:#1a1e28;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#f0f2f8;--text2:#8892a4;--text3:#4a5568;
  --green:#22d37a;--green-bg:rgba(34,211,122,0.1);--green-bd:rgba(34,211,122,0.25);
  --blue:#4f9cf9;--blue-bg:rgba(79,156,249,0.1);
  --amber:#f5a623;--amber-bg:rgba(245,166,35,0.1);
  --red:#f56565;--red-bg:rgba(245,101,101,0.1);
  --radius:12px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.nav-logo{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700;color:var(--text)}
.nav-logo span{color:var(--green)}
.nav-right{display:flex;align-items:center;gap:1rem}
.nav-negocio{font-size:0.84rem;color:var(--text2)}
.nav-negocio strong{color:var(--text)}
.btn-logout{padding:0.45rem 1rem;background:var(--red-bg);color:var(--red);border:1px solid rgba(245,101,101,0.25);border-radius:8px;cursor:pointer;font-size:0.82rem;font-family:'DM Sans',sans-serif;transition:all 0.15s}
.btn-logout:hover{background:rgba(245,101,101,0.2)}

.main{flex:1;padding:2rem;max-width:900px;margin:0 auto;width:100%}

.bot-status{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:2rem}
.bot-status-left{display:flex;align-items:center;gap:12px}
.bot-icon{width:44px;height:44px;border-radius:12px;background:var(--green-bg);display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.bot-status-info h2{font-family:'Syne',sans-serif;font-size:1rem;font-weight:600;margin-bottom:2px}
.bot-status-info p{font-size:0.82rem;color:var(--text2)}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:100px;font-size:0.82rem;font-weight:500}
.status-pill.active{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.status-pill.active::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.status-pill.paused{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(245,166,35,0.25)}
.status-pill.paused::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--amber)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:1.5rem}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.card-title{font-family:'Syne',sans-serif;font-size:0.9rem;font-weight:600;display:flex;align-items:center;gap:8px}
.card-hint{font-size:0.76rem;color:var(--text3);margin-bottom:1rem;line-height:1.5}

.form-group{margin-bottom:1.1rem}
.form-group label{display:block;font-size:0.78rem;color:var(--text2);margin-bottom:5px;font-weight:500}
.form-group input,.form-group textarea{width:100%;padding:0.7rem 1rem;background:var(--bg3);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none;transition:border-color 0.2s,box-shadow 0.2s}
.form-group input:focus,.form-group textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.form-group input::placeholder,.form-group textarea::placeholder{color:var(--text3)}
.form-group textarea{resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

.btn-save{display:inline-flex;align-items:center;gap:8px;padding:0.65rem 1.4rem;background:var(--green);color:#0d0f14;border:none;border-radius:9px;font-family:'Syne',sans-serif;font-size:0.86rem;font-weight:600;cursor:pointer;transition:all 0.2s}
.btn-save:hover{background:#1cb569;transform:translateY(-1px)}
.btn-save:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.btn-secondary{display:inline-flex;align-items:center;gap:6px;padding:0.55rem 1rem;background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.84rem;cursor:pointer;transition:all 0.15s}
.btn-secondary:hover{color:var(--text);border-color:var(--border2)}

/* FAQs */
.faq-list{display:flex;flex-direction:column;gap:10px;margin-bottom:1rem}
.faq-item{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:1rem;position:relative}
.faq-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.faq-label{font-size:0.72rem;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.05em}
.faq-delete{background:none;border:none;color:var(--text3);cursor:pointer;font-size:1rem;padding:2px;transition:color 0.15s}
.faq-delete:hover{color:var(--red)}
.faq-input{width:100%;padding:0.55rem 0.8rem;background:var(--bg2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.84rem;outline:none;transition:border-color 0.15s;margin-bottom:6px}
.faq-input:focus{border-color:var(--green)}
.faq-input:last-child{margin-bottom:0}
.faq-empty{text-align:center;padding:1.5rem;color:var(--text3);font-size:0.84rem;border:1px dashed var(--border);border-radius:9px;margin-bottom:1rem}

/* TOAST */
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--green);color:#0d0f14;padding:0.8rem 1.5rem;border-radius:10px;font-size:0.88rem;font-weight:500;display:flex;align-items:center;gap:8px;transform:translateY(100px);opacity:0;transition:all 0.3s;z-index:999;box-shadow:0 8px 30px rgba(34,211,122,0.2)}
.toast.show{transform:translateY(0);opacity:1}
.loading-screen{display:flex;align-items:center;justify-content:center;min-height:60vh;font-size:0.9rem;color:var(--text2)}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">Bot<span>Manager</span></div>
  <div class="nav-right">
    <div class="nav-negocio">Panel de <strong id="nav-nombre">tu negocio</strong></div>
    <button class="btn-logout" onclick="cerrarSesion()">🚪 Salir</button>
  </div>
</nav>

<div class="main" id="main-content">
  <div class="loading-screen">⏳ Cargando tu panel...</div>
</div>

<div class="toast" id="toast">✅ Guardado</div>

<script>
  const SUPABASE_URL = "https://kkbwtoaqilrrezeqyfjn.supabase.co"
  const SUPABASE_ANON_KEY = "sb_publishable_07HNpDdDOITolQqvGUzqUg_PBvdLiJI"

  const { createClient } = supabase
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true }
  })

  let negocio = null
  let faqs = []

  async function init() {
    const { data: { session } } = await db.auth.getSession()
    if (!session) { window.location.href = "/login.html"; return }

    const { data, error } = await db.from("negocios")
      .select("*")
      .eq("user_id", session.user.id)
      .single()

    if (error || !data) {
      document.getElementById("main-content").innerHTML = `
        <div class="loading-screen" style="flex-direction:column;gap:1rem">
          <span style="font-size:2rem">😕</span>
          <p>No encontramos un negocio asociado a tu cuenta.</p>
          <p style="font-size:0.8rem;color:var(--text3)">Contacta al administrador.</p>
        </div>`
      return
    }

    negocio = data
    faqs = Array.isArray(negocio.faqs) ? negocio.faqs : []
    document.getElementById("nav-nombre").textContent = negocio.nombre
    renderPanel()
  }

  function renderPanel() {
    document.getElementById("main-content").innerHTML = `

      <div class="bot-status">
        <div class="bot-status-left">
          <div class="bot-icon">🤖</div>
          <div class="bot-status-info">
            <h2>Asistente de ${negocio.nombre}</h2>
            <p>Tu bot responde a clientes automáticamente 24/7</p>
          </div>
        </div>
        <span class="status-pill ${negocio.bot_activo ? "active" : "paused"}">
          ${negocio.bot_activo ? "● Bot activo" : "● Bot pausado"}
        </span>
      </div>

      <!-- INFO GENERAL -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">📋 Información del negocio</div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Nombre del negocio</label>
            <input type="text" id="f-nombre" value="${negocio.nombre || ""}" placeholder="Nombre de tu negocio"/>
          </div>
          <div class="form-group">
            <label>Teléfono</label>
            <input type="tel" id="f-telefono" value="${negocio.telefono || ""}" placeholder="+502 0000-0000"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Dirección</label>
            <input type="text" id="f-direccion" value="${negocio.direccion || ""}" placeholder="Zona 10, Guatemala City"/>
          </div>
          <div class="form-group">
            <label>Email de contacto</label>
            <input type="email" id="f-email" value="${negocio.email || ""}" placeholder="contacto@tunegocio.com"/>
          </div>
        </div>
        <button class="btn-save" onclick="guardarInfo()">💾 Guardar información</button>
      </div>

      <!-- HORARIOS -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">🕐 Horarios de atención</div>
        </div>
        <p class="card-hint">El bot usará este texto para responder cuando pregunten por tus horarios.</p>
        <div class="form-group">
          <label>Horario general</label>
          <input type="text" id="f-horario" value="${negocio.horario || ""}" placeholder="Lunes a Viernes 8:00 AM - 6:00 PM, Sábados 9:00 AM - 1:00 PM"/>
        </div>
        <button class="btn-save" onclick="guardarHorario()">💾 Guardar horario</button>
      </div>

      <!-- SERVICIOS -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">⚡ Servicios que ofreces</div>
        </div>
        <p class="card-hint">El bot mencionará estos servicios cuando los clientes pregunten qué ofreces. Sepáralos por coma.</p>
        <div class="form-group">
          <textarea id="f-servicios" style="min-height:80px" placeholder="Medicina General, Pediatría, Cardiología...">${negocio.servicios || ""}</textarea>
        </div>
        <button class="btn-save" onclick="guardarServicios()">💾 Guardar servicios</button>
      </div>

      <!-- MENSAJE DE BIENVENIDA -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">👋 Mensaje de bienvenida</div>
        </div>
        <p class="card-hint">Este es el primer mensaje que verán tus clientes al abrir el chat.</p>
        <div class="form-group">
          <textarea id="f-bienvenida" style="min-height:100px" placeholder="¡Hola! 👋 Soy el asistente virtual de ${negocio.nombre}. Estoy aquí para ayudarte con citas, horarios e información. ¿En qué te puedo ayudar hoy?">${negocio.mensaje_bienvenida || ""}</textarea>
        </div>
        <button class="btn-save" onclick="guardarBienvenida()">💾 Guardar mensaje</button>
      </div>

      <!-- LINK AGENDAMIENTO -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">📅 Link de agendamiento</div>
        </div>
        <p class="card-hint">Cuando un cliente quiera agendar una cita, el bot compartirá este enlace automáticamente.</p>
        <div class="form-group">
          <label>URL de tu calendario (Cal.com, Calendly, etc.)</label>
          <input type="url" id="f-agenda" value="${negocio.link_agendamiento || ""}" placeholder="https://cal.com/tu-usuario/30min"/>
        </div>
        <button class="btn-save" onclick="guardarAgenda()">💾 Guardar enlace</button>
      </div>

      <!-- PREGUNTAS FRECUENTES -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">❓ Preguntas frecuentes</div>
          <button class="btn-secondary" onclick="agregarFaq()">＋ Agregar pregunta</button>
        </div>
        <p class="card-hint">El bot usará estas respuestas exactas cuando los clientes hagan estas preguntas.</p>
        <div class="faq-list" id="faq-list"></div>
        <button class="btn-save" onclick="guardarFaqs()">💾 Guardar preguntas</button>
      </div>

    `
    renderFaqs()
  }

  // ── FAQs ───────────────────────────────────────────────────
  function renderFaqs() {
    const list = document.getElementById("faq-list")
    if (!faqs.length) {
      list.innerHTML = `<div class="faq-empty">No hay preguntas frecuentes aún — agrega la primera</div>`
      return
    }
    list.innerHTML = faqs.map((f, i) => `
      <div class="faq-item">
        <div class="faq-item-header">
          <span class="faq-label">Pregunta ${i + 1}</span>
          <button class="faq-delete" onclick="eliminarFaq(${i})" title="Eliminar">✕</button>
        </div>
        <input class="faq-input" type="text" placeholder="¿Tienen estacionamiento?" value="${f.pregunta || ""}" onchange="faqs[${i}].pregunta = this.value"/>
        <input class="faq-input" type="text" placeholder="Sí, contamos con parqueo gratuito frente al local." value="${f.respuesta || ""}" onchange="faqs[${i}].respuesta = this.value"/>
      </div>
    `).join("")
  }

  function agregarFaq() {
    faqs.push({ pregunta: "", respuesta: "" })
    renderFaqs()
    // Scroll al nuevo item
    setTimeout(() => {
      const items = document.querySelectorAll(".faq-item")
      items[items.length - 1]?.scrollIntoView({ behavior: "smooth", block: "center" })
    }, 100)
  }

  function eliminarFaq(i) {
    faqs.splice(i, 1)
    renderFaqs()
  }

  // ── Guardar funciones ──────────────────────────────────────
  async function guardarInfo() {
    const updates = {
      nombre: document.getElementById("f-nombre").value,
      telefono: document.getElementById("f-telefono").value,
      direccion: document.getElementById("f-direccion").value,
      email: document.getElementById("f-email").value,
    }
    await guardar(updates)
    document.getElementById("nav-nombre").textContent = updates.nombre
  }

  async function guardarHorario() {
    await guardar({ horario: document.getElementById("f-horario").value })
  }

  async function guardarServicios() {
    await guardar({ servicios: document.getElementById("f-servicios").value })
  }

  async function guardarBienvenida() {
    await guardar({ mensaje_bienvenida: document.getElementById("f-bienvenida").value })
  }

  async function guardarAgenda() {
    await guardar({ link_agendamiento: document.getElementById("f-agenda").value })
  }

  async function guardarFaqs() {
    // Recoger valores actuales de los inputs
    const items = document.querySelectorAll(".faq-item")
    const faqsActualizados = Array.from(items).map(item => {
      const inputs = item.querySelectorAll(".faq-input")
      return { pregunta: inputs[0].value, respuesta: inputs[1].value }
    }).filter(f => f.pregunta.trim())
    faqs = faqsActualizados
    await guardar({ faqs: faqsActualizados })
  }

  async function guardar(updates) {
    const { error } = await db.from("negocios").update(updates).eq("id", negocio.id)
    if (error) { alert("Error al guardar: " + error.message); return }
    Object.assign(negocio, updates)
    mostrarToast("✅ Cambios guardados — el bot ya los usa")
  }

  function mostrarToast(msg) {
    const t = document.getElementById("toast")
    t.textContent = msg
    t.classList.add("show")
    setTimeout(() => t.classList.remove("show"), 3000)
  }

  async function cerrarSesion() {
    await db.auth.signOut()
    window.location.href = "/login.html"
  }

  init()
</script>
</body>
</html>
