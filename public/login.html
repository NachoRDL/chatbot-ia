<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BotManager — Iniciar sesión</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;--bg2:#13161e;--bg3:#1a1e28;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.15);
  --text:#f0f2f8;--text2:#8892a4;--text3:#4a5568;
  --green:#22d37a;--green-bg:rgba(34,211,122,0.1);--green-bd:rgba(34,211,122,0.25);
  --red:#f56565;--red-bg:rgba(245,101,101,0.1);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}

.login-wrap{width:100%;max-width:420px}

.logo{text-align:center;margin-bottom:2.5rem}
.logo h1{font-family:'Syne',sans-serif;font-size:2rem;font-weight:700;letter-spacing:-0.03em}
.logo h1 span{color:var(--green)}
.logo p{font-size:0.88rem;color:var(--text2);margin-top:6px}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:2rem}

.form-group{margin-bottom:1.25rem}
.form-group label{display:block;font-size:0.82rem;color:var(--text2);margin-bottom:6px;font-weight:500}
.form-group input{
  width:100%;padding:0.75rem 1rem;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:10px;color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:0.92rem;
  outline:none;transition:border-color 0.2s;
}
.form-group input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.form-group input::placeholder{color:var(--text3)}

.btn-login{
  width:100%;padding:0.85rem;
  background:var(--green);color:#0d0f14;
  border:none;border-radius:10px;
  font-family:'Syne',sans-serif;font-size:0.95rem;font-weight:600;
  cursor:pointer;transition:all 0.2s;margin-top:0.5rem;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-login:hover{background:#1cb569;transform:translateY(-1px)}
.btn-login:disabled{opacity:0.6;cursor:not-allowed;transform:none}

.error-msg{
  background:var(--red-bg);border:1px solid rgba(245,101,101,0.25);
  color:var(--red);padding:0.75rem 1rem;border-radius:8px;
  font-size:0.84rem;margin-bottom:1rem;display:none;
}
.error-msg.show{display:block}

.footer-txt{text-align:center;font-size:0.78rem;color:var(--text3);margin-top:1.5rem}

/* Loader */
.spinner{width:16px;height:16px;border:2px solid rgba(13,15,20,0.3);border-top-color:#0d0f14;border-radius:50%;animation:spin 0.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Fondo decorativo */
.bg-deco{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:-1}
.bg-deco::before{content:'';position:absolute;top:-30%;left:-20%;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,122,0.06) 0%,transparent 70%)}
.bg-deco::after{content:'';position:absolute;bottom:-20%;right:-10%;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(79,156,249,0.05) 0%,transparent 70%)}
</style>
</head>
<body>

<div class="bg-deco"></div>

<div class="login-wrap">
  <div class="logo">
    <h1>Bot<span>Manager</span></h1>
    <p>Panel de administración</p>
  </div>

  <div class="card">
    <div class="error-msg" id="error-msg">❌ Email o contraseña incorrectos</div>

    <div class="form-group">
      <label>Correo electrónico</label>
      <input type="email" id="email" placeholder="admin@ejemplo.com" onkeydown="if(event.key==='Enter') login()"/>
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') login()"/>
    </div>

    <button class="btn-login" id="btn-login" onclick="login()">
      Iniciar sesión
    </button>
  </div>

  <p class="footer-txt">Solo administradores autorizados pueden acceder.</p>
</div>

<script>
  // ── CONFIG ─────────────────────────────────────────────────
  const SUPABASE_URL = "https://kkbwtoaqilrrezeqyfjn.supabase.co"
  const SUPABASE_ANON_KEY = "sb_publishable_07HNpDdDOITolQqvGUzqUg_PBvdLiJI"
  // ──────────────────────────────────────────────────────────

  const { createClient } = supabase
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  // Si ya hay sesión activa, redirigir al admin
  async function checkSession() {
    const { data: { session } } = await db.auth.getSession()
    if (session) {
      window.location.href = "/admin.html"
    }
  }
  checkSession()

  async function login() {
    const email = document.getElementById("email").value.trim()
    const password = document.getElementById("password").value
    const btn = document.getElementById("btn-login")
    const errorMsg = document.getElementById("error-msg")

    if (!email || !password) {
      errorMsg.textContent = "❌ Por favor completa todos los campos"
      errorMsg.classList.add("show")
      return
    }

    // Loading
    btn.disabled = true
    btn.innerHTML = '<div class="spinner"></div> Iniciando sesión...'
    errorMsg.classList.remove("show")

    const { data, error } = await db.auth.signInWithPassword({ email, password })

    if (error) {
      btn.disabled = false
      btn.innerHTML = "Iniciar sesión"
      errorMsg.textContent = "❌ Email o contraseña incorrectos"
      errorMsg.classList.add("show")
      return
    }

    // Verificar si es admin o cliente
const { data: admin } = await db.from("admins").select("*").eq("id", data.user.id).single()

if (admin) {
  window.location.href = "/admin.html"
} else {
  // Es cliente, verificar que tiene negocio
  const { data: neg } = await db.from("negocios").select("id").eq("user_id", data.user.id).single()
  if (neg) {
    window.location.href = "/dashboard.html"
  } else {
    await db.auth.signOut()
    btn.disabled = false
    btn.innerHTML = "Iniciar sesión"
    errorMsg.textContent = "❌ No tienes acceso autorizado"
    errorMsg.classList.add("show")
  }
}
  }
</script>
</body>
</html>
